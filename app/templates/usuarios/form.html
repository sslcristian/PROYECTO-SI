{% extends "base.html" %}
{% block title %}{{ 'Editar' if usuario else 'Nuevo' }} Usuario{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">
                    <i class="bi bi-person-plus"></i>
                    {{ 'Editar Usuario' if usuario else 'Nuevo Usuario' }}
                </h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nombres *</label>
                            <input type="text" name="nombres" class="form-control" required
                                   value="{{ usuario.nombres if usuario else '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Apellidos *</label>
                            <input type="text" name="apellidos" class="form-control" required
                                   value="{{ usuario.apellidos if usuario else '' }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Documento *</label>
                            <input type="text" name="documento" class="form-control" required
                                   value="{{ usuario.documento if usuario else '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="text" name="telefono" class="form-control"
                                   value="{{ usuario.telefono if usuario else '' }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo *</label>
                        <input type="email" name="correo" class="form-control" required
                               value="{{ usuario.correo if usuario else '' }}">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nombre de usuario *</label>
                            <input type="text" name="nombre_usuario" class="form-control" required
                                   value="{{ usuario.nombre_usuario if usuario else '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Contraseña {% if usuario %}(dejar vacío para no cambiar){% else %}*{% endif %}</label>
                            <input type="password" name="contrasena" class="form-control"
                                   {% if not usuario %}required{% endif %}>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Rol *</label>
                            <select name="rol_id" class="form-select" required>
                                {% for r in roles %}
                                <option value="{{ r.id }}" {% if usuario and usuario.rol_id == r.id %}selected{% endif %}>
                                    {{ r.nombre }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Estado</label>
                            <select name="estado" class="form-select">
                                <option value="ACTIVO" {% if usuario and usuario.estado == 'ACTIVO' %}selected{% endif %}>Activo</option>
                                <option value="INACTIVO" {% if usuario and usuario.estado == 'INACTIVO' %}selected{% endif %}>Inactivo</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('usuarios.index') }}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
