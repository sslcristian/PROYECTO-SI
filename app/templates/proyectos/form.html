{% extends "base.html" %}
{% block title %}{{ 'Editar' if proyecto else 'Nuevo' }} Proyecto{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-9">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">
                    <i class="bi bi-folder-plus"></i>
                    {{ 'Editar Proyecto' if proyecto else 'Nuevo Proyecto' }}
                </h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nombre del Proyecto *</label>
                        <input type="text" name="nombre" class="form-control" required
                               value="{{ proyecto.nombre if proyecto else '' }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea name="descripcion" class="form-control" rows="2">{{ proyecto.descripcion if proyecto else '' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Objetivo</label>
                        <textarea name="objetivo" class="form-control" rows="2">{{ proyecto.objetivo if proyecto else '' }}</textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Fecha Inicio</label>
                            <input type="date" name="fecha_inicio" class="form-control"
                                   value="{{ proyecto.fecha_inicio if proyecto and proyecto.fecha_inicio else '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Fecha Fin Estimada</label>
                            <input type="date" name="fecha_fin_estimada" class="form-control"
                                   value="{{ proyecto.fecha_fin_estimada if proyecto and proyecto.fecha_fin_estimada else '' }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Estado</label>
                            <select name="estado" class="form-select">
                                {% set estados = ['PLANEADO', 'ACTIVO', 'SUSPENDIDO', 'FINALIZADO', 'CANCELADO'] %}
                                {% for e in estados %}
                                <option value="{{ e }}" {% if proyecto and proyecto.estado == e %}selected{% endif %}>{{ e }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Prioridad</label>
                            <select name="prioridad" class="form-select">
                                {% set prioridades = ['ALTA', 'MEDIA', 'BAJA'] %}
                                {% for p in prioridades %}
                                <option value="{{ p }}" {% if proyecto and proyecto.prioridad == p %}selected{% endif %}>{{ p }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Líder del Proyecto</label>
                            <select name="lider_id" class="form-select">
                                <option value="">— Sin asignar —</option>
                                {% for l in lideres %}
                                <option value="{{ l.id }}" {% if proyecto and proyecto.lider_id == l.id %}selected{% endif %}>
                                    {{ l.nombres }} {{ l.apellidos }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('proyectos.index') }}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
